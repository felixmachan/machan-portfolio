<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">Button box floorplan</title>
  <desc id="d">Top-side floorplan of the button box PCB: twelve push buttons in a 3 by 4 grid, four rotary encoders along the bottom edge, four LEDs around every control, and a mounting hole in each corner.</desc>
  <style>
    .bg { fill: #fbfbf9; }
    .gridline { stroke: #ecebe5; stroke-width: 1; }
    .zone { fill: #f3f3ef; stroke: #d9d8d0; stroke-width: 1.2; }
    .zone-tab { fill: #383b40; }
    .tab { font: 600 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; fill: #fbfbf9; }
    .zone-title { font: 500 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #5d6167; }
    .node { fill: #ffffff; stroke: #383b40; stroke-width: 1.3; }
    .node--accent { stroke: #b05c1e; }
    .kicker { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #b05c1e; }
    .name { font: 650 16px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1b1d21; }
    .sub { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #5d6167; }
    .link { fill: none; stroke: #383b40; stroke-width: 1.4; }
    .link--tunnel { stroke: #b05c1e; stroke-dasharray: 7 5; stroke-width: 1.6; }
    .arrow { fill: #383b40; }
    .arrow--accent { fill: #b05c1e; }
    .link-label { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #5d6167; paint-order: stroke; stroke: #f3f3ef; stroke-width: 5px; }
    .link-label--accent { fill: #b05c1e; }
    .note { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #5d6167; }

    .link--ctrl { stroke: #b05c1e; stroke-dasharray: 4 4; stroke-width: 1.4; fill: none; }
    .dot { fill: #383b40; }
    .board { fill: #ffffff; stroke: #383b40; stroke-width: 1.6; }
    .keepout { fill: url(#hatch); stroke: #d9d8d0; stroke-width: 1; }
    .hatchline { stroke: #d9d8d0; stroke-width: 1.2; }
    .region { fill: #f6ebe2; stroke: #b05c1e; stroke-width: 1.2; }
    .region--muted { fill: #f3f3ef; stroke: #383b40; stroke-width: 1; }
    .hole { fill: #fbfbf9; stroke: #383b40; stroke-width: 1.2; }
    .marker { fill: #b05c1e; }
    .marker-t { font: 600 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #fbfbf9; }
    .legend-name { font: 600 14px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1b1d21; }
    .dim { stroke: #5d6167; stroke-width: 1; }
    .legend { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #5d6167; }

  <line class="link" x1="214" y1="100" x2="252" y2="100"/>
  <line class="link" x1="352" y1="100" x2="428" y2="100"/>
  <polyline class="link" points="214,150 234,150 234,206 400,206 400,150 428,150"/>
  <line class="link" x1="640" y1="122" x2="688" y2="122"/>
  <polyline class="link" points="688,122 688,96 752,96"/>
  <polyline class="link" points="688,122 688,226 752,226"/>
  <polyline class="link" points="688,122 688,356 752,356"/>
  <line class="link" x1="534" y1="174" x2="534" y2="250"/>
  <rect class="node" x="44" y="70" width="170" height="104"/>
  <text class="kicker" x="56" y="89">Connector</text>
  <text class="name" x="56" y="110">USB-C</text>
  <text class="sub" x="56" y="128">5 V VBUS</text>
  <text class="sub" x="56" y="144">CC 5.1 kΩ pull-downs</text>
  <rect class="node" x="252" y="70" width="100" height="104"/>
  <text class="kicker" x="264" y="89">LDO</text>
  <text class="name" x="264" y="110">3.3 V</text>
  <text class="sub" x="264" y="128">NCP1117</text>
  <rect class="node node--accent" x="44" y="250" width="170" height="104"/>
  <text class="kicker" x="56" y="269">Host</text>
  <text class="name" x="56" y="290">PC · game</text>
  <text class="sub" x="56" y="308">USB HID</text>
  <text class="sub" x="56" y="324">joystick buttons</text>
  <rect class="node node--accent" x="428" y="70" width="212" height="104"/>

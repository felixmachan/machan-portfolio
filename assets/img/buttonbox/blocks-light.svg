  <text class="name" x="440" y="110">RP2040</text>
  <text class="sub" x="440" y="128">dual Cortex-M0+</text>
  <text class="sub" x="440" y="144">native USB</text>
  <rect class="node" x="428" y="250" width="212" height="104"/>
  <text class="kicker" x="440" y="269">Boot</text>
  <text class="name" x="440" y="290">QSPI flash</text>
  <text class="sub" x="440" y="308">+ crystal</text>
  <text class="sub" x="440" y="324">firmware storage</text>
  <rect class="node" x="752" y="52" width="404" height="92"/>
  <text class="kicker" x="764" y="71">Matrix · 7 GPIO</text>
  <text class="name" x="764" y="92">12 push buttons</text>
  <text class="sub" x="764" y="110">3 rows × 4 columns · 10 kΩ pull-ups</text>
  <rect class="node" x="752" y="180" width="404" height="92"/>
  <text class="kicker" x="764" y="199">Quadrature · 8 GPIO</text>
  <text class="name" x="764" y="220">4 rotary encoders</text>
  <text class="sub" x="764" y="238">A/B channels, common to ground</text>
  <rect class="node node--accent" x="752" y="310" width="404" height="92"/>
  <text class="kicker" x="764" y="329">Data line · 1 GPIO</text>
  <text class="name" x="764" y="350">64 per-control LEDs</text>
  <text class="sub" x="764" y="368">4 around every button and encoder</text>
  <text class="link-label" x="233" y="90" text-anchor="middle">5 V</text>
  <text class="link-label" x="390" y="90" text-anchor="middle">3.3 V</text>
  <text class="link-label" x="317" y="196" text-anchor="middle">D+ / D−</text>
  <text class="link-label" x="544" y="214" text-anchor="start">QSPI</text>
  <text class="link-label" x="139" y="214" text-anchor="start">USB cable</text>

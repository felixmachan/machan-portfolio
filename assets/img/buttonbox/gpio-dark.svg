  <text class="kicker" x="354.0" y="100" text-anchor="middle">4</text>
  <text class="legend-name" x="354.0" y="148" text-anchor="middle">C</text>
  <rect class="region--muted" x="390" y="110" width="60" height="64"/>
  <text class="kicker" x="420.0" y="100" text-anchor="middle">5</text>
  <text class="legend-name" x="420.0" y="148" text-anchor="middle">C</text>
  <rect class="region--muted" x="456" y="110" width="60" height="64"/>
  <text class="kicker" x="486.0" y="100" text-anchor="middle">6</text>
  <text class="legend-name" x="486.0" y="148" text-anchor="middle">C</text>

  <line class="dim" x1="522" y1="186" x2="522" y2="198"/>
  <line class="dim" x1="1044" y1="186" x2="1044" y2="198"/>
  <text class="legend-name" x="783.0" y="220" text-anchor="middle">Encoders A/B</text>
  <text class="sub" x="783.0" y="238" text-anchor="middle">8 pins</text>
  <rect class="region" x="1050" y="110" width="60" height="64"/>
  <text class="kicker" x="1080.0" y="100" text-anchor="middle">15</text>
  <text class="legend-name" x="1080.0" y="148" text-anchor="middle">D</text>
  <line class="dim" x1="1050" y1="192" x2="1110" y2="192"/>
  <line class="dim" x1="1050" y1="186" x2="1050" y2="198"/>
  <line class="dim" x1="1110" y1="186" x2="1110" y2="198"/>
  <text class="legend-name" x="1080.0" y="220" text-anchor="middle">LEDs</text>
  <text class="sub" x="1080.0" y="238" text-anchor="middle">1 pin</text>
  <text class="sub" x="60" y="72">GPIO 0–15 used · 16–29 free for expansion</text>
  <text class="note" x="60" y="300">A matrix turns 12 buttons into 7 pins; the encoders need both quadrature channels, and all 64 LEDs share one data line.</text>
</svg>

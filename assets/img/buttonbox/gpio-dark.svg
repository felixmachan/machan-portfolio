  <text class="legend-name" x="156.0" y="148" text-anchor="middle">R</text>
  <rect class="region" x="192" y="110" width="60" height="64"/>
  <text class="kicker" x="222.0" y="100" text-anchor="middle">2</text>
  <text class="legend-name" x="222.0" y="148" text-anchor="middle">R</text>
  <line class="dim" x1="60" y1="192" x2="252" y2="192"/>
  <line class="dim" x1="60" y1="186" x2="60" y2="198"/>
  <line class="dim" x1="252" y1="186" x2="252" y2="198"/>
  <text class="legend-name" x="156.0" y="220" text-anchor="middle">Rows</text>
  <text class="sub" x="156.0" y="238" text-anchor="middle">3 pins</text>
  <rect class="region--muted" x="258" y="110" width="60" height="64"/>
  <text class="kicker" x="288.0" y="100" text-anchor="middle">3</text>
  <text class="legend-name" x="288.0" y="148" text-anchor="middle">C</text>

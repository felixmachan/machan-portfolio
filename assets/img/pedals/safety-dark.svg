<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Safety factor by alloy</title>
  <desc id="d">Safety factor against yield at 2000 N for the pedal arm: EN AW-5083 O/H111 0.29, 5083 H116 0.49, 6061 T6 0.55, 6082 T6 0.60, 7075 T6 1.05 with the original geometry and 1.27 with the repaired geometry.</desc>
  <style>

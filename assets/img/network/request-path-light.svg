<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Request path</title>
  <desc id="d">A visitor reaches Cloudflare over HTTPS; Cloudflare forwards through an outbound-only tunnel to cloudflared on the home VM, then nginx, the Django app and a PostGIS database that has no published port.</desc>
  <style>
    .bg { fill: #fbfbf9; }
    .gridline { stroke: #ecebe5; stroke-width: 1; }
    .zone { fill: #f3f3ef; stroke: #d9d8d0; stroke-width: 1.2; }
    .zone-tab { fill: #383b40; }
    .tab { font: 600 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; fill: #fbfbf9; }
    .zone-title { font: 500 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #5d6167; }
    .node { fill: #ffffff; stroke: #383b40; stroke-width: 1.3; }
    .node--accent { stroke: #b05c1e; }
    .kicker { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #b05c1e; }
    .name { font: 650 16px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1b1d21; }
    .sub { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #5d6167; }
    .link { fill: none; stroke: #383b40; stroke-width: 1.4; }
    .link--tunnel { stroke: #b05c1e; stroke-dasharray: 7 5; stroke-width: 1.6; }
    .arrow { fill: #383b40; }
    .arrow--accent { fill: #b05c1e; }
    .link-label { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #5d6167; paint-order: stroke; stroke: #f3f3ef; stroke-width: 5px; }
    .link-label--accent { fill: #b05c1e; }
    .note { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #5d6167; }
  </style>
  <rect class="bg" width="1200" height="280"/>
  <line class="gridline" x1="0" y1="0" x2="0" y2="280"/><line class="gridline" x1="40" y1="0" x2="40" y2="280"/><line class="gridline" x1="80" y1="0" x2="80" y2="280"/><line class="gridline" x1="120" y1="0" x2="120" y2="280"/><line class="gridline" x1="160" y1="0" x2="160" y2="280"/><line class="gridline" x1="200" y1="0" x2="200" y2="280"/><line class="gridline" x1="240" y1="0" x2="240" y2="280"/><line class="gridline" x1="280" y1="0" x2="280" y2="280"/><line class="gridline" x1="320" y1="0" x2="320" y2="280"/><line class="gridline" x1="360" y1="0" x2="360" y2="280"/><line class="gridline" x1="400" y1="0" x2="400" y2="280"/><line class="gridline" x1="440" y1="0" x2="440" y2="280"/><line class="gridline" x1="480" y1="0" x2="480" y2="280"/><line class="gridline" x1="520" y1="0" x2="520" y2="280"/><line class="gridline" x1="560" y1="0" x2="560" y2="280"/><line class="gridline" x1="600" y1="0" x2="600" y2="280"/><line class="gridline" x1="640" y1="0" x2="640" y2="280"/><line class="gridline" x1="680" y1="0" x2="680" y2="280"/><line class="gridline" x1="720" y1="0" x2="720" y2="280"/><line class="gridline" x1="760" y1="0" x2="760" y2="280"/><line class="gridline" x1="800" y1="0" x2="800" y2="280"/><line class="gridline" x1="840" y1="0" x2="840" y2="280"/><line class="gridline" x1="880" y1="0" x2="880" y2="280"/><line class="gridline" x1="920" y1="0" x2="920" y2="280"/><line class="gridline" x1="960" y1="0" x2="960" y2="280"/><line class="gridline" x1="1000" y1="0" x2="1000" y2="280"/><line class="gridline" x1="1040" y1="0" x2="1040" y2="280"/><line class="gridline" x1="1080" y1="0" x2="1080" y2="280"/><line class="gridline" x1="1120" y1="0" x2="1120" y2="280"/><line class="gridline" x1="1160" y1="0" x2="1160" y2="280"/><line class="gridline" x1="1200" y1="0" x2="1200" y2="280"/><line class="gridline" x1="0" y1="0" x2="1200" y2="0"/><line class="gridline" x1="0" y1="40" x2="1200" y2="40"/><line class="gridline" x1="0" y1="80" x2="1200" y2="80"/><line class="gridline" x1="0" y1="120" x2="1200" y2="120"/><line class="gridline" x1="0" y1="160" x2="1200" y2="160"/><line class="gridline" x1="0" y1="200" x2="1200" y2="200"/><line class="gridline" x1="0" y1="240" x2="1200" y2="240"/><line class="gridline" x1="0" y1="280" x2="1200" y2="280"/>
  <rect class="zone" x="24" y="24" width="430" height="232"/>
  <path class="zone-tab" d="M24 24 h44.2 v22 h-44.2 z"/>
  <text class="tab" x="35" y="39">Z-0</text>
  <text class="zone-title" x="80.2" y="39.5">Internet</text>
  <rect class="zone" x="478" y="24" width="698" height="232"/>
  <path class="zone-tab" d="M478 24 h44.2 v22 h-44.2 z"/>
  <text class="tab" x="489" y="39">Z-2</text>
  <text class="zone-title" x="534.2" y="39.5">Home · Cheerlify VM</text>
  <rect class="node" x="44" y="90" width="180" height="104"/>
  <text class="kicker" x="56" y="109">Client</text>
  <text class="name" x="56" y="130">Visitor</text>
  <text class="sub" x="56" y="148">browser · app</text>
  <rect class="node node--accent" x="254" y="90" width="180" height="104"/>
  <text class="kicker" x="266" y="109">Edge</text>
  <text class="name" x="266" y="130">Cloudflare</text>
  <text class="sub" x="266" y="148">TLS 1.2+ · HSTS</text>
  <text class="sub" x="266" y="164">Access on /admin</text>
  <rect class="node node--accent" x="498" y="90" width="150" height="104"/>
  <text class="kicker" x="510" y="109">Connector</text>
  <text class="name" x="510" y="130">cloudflared</text>
  <text class="sub" x="510" y="148">dials out only</text>
  <rect class="node" x="678" y="90" width="150" height="104"/>
  <text class="kicker" x="690" y="109">Proxy</text>
  <text class="name" x="690" y="130">nginx</text>
  <text class="sub" x="690" y="148">CSP · HSTS</text>
  <text class="sub" x="690" y="164">security headers</text>
  <rect class="node" x="858" y="90" width="150" height="104"/>
  <text class="kicker" x="870" y="109">App</text>
  <text class="name" x="870" y="130">Django</text>
  <text class="sub" x="870" y="148">gunicorn + ASGI</text>
  <text class="sub" x="870" y="164">localhost-bound</text>
  <rect class="node" x="1038" y="90" width="118" height="104"/>
  <text class="kicker" x="1050" y="109">Data</text>
  <text class="name" x="1050" y="130">PostGIS</text>
  <text class="sub" x="1050" y="148">no published</text>
  <text class="sub" x="1050" y="164">port</text>
  <line class="link" x1="224" y1="142" x2="247" y2="142"/>
  <path class="arrow" d="M254 142 l-9 -4.5 v9 z"/>
  <line class="link link--tunnel" x1="434" y1="142" x2="491" y2="142"/>
  <path class="arrow arrow--accent" d="M498 142 l-9 -4.5 v9 z"/>
  <line class="link" x1="648" y1="142" x2="671" y2="142"/>
  <path class="arrow" d="M678 142 l-9 -4.5 v9 z"/>
  <line class="link" x1="828" y1="142" x2="851" y2="142"/>
  <path class="arrow" d="M858 142 l-9 -4.5 v9 z"/>
  <line class="link" x1="1008" y1="142" x2="1031" y2="142"/>
  <path class="arrow" d="M1038 142 l-9 -4.5 v9 z"/>
  <text class="link-label link-label--accent" x="466" y="130" text-anchor="middle">tunnel</text>
  <text class="note" x="44" y="226">Router: no port forwarding for the public sites.</text>
  <text class="note" x="498" y="226">The connection is opened from inside the home network.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Home network topology</title>
  <desc id="d">Internet traffic reaches the public sites through Cloudflare and an outbound Cloudflare Tunnel, with no open inbound ports. A bridged modem and the main router serve LAN clients and a Proxmox VE host (Lenovo ThinkCentre M710q) running Cheerlify, Umami, Pi-hole, Nginx Proxy Manager, TrueNAS, Plex, Vaultwarden, Home Assistant, Tailscale, RustDesk, Netdata and encrypted backups to Cloudflare R2. Remote devices connect through Tailscale; Zigbee and MQTT link Home Assistant to Philips Hue, IKEA, Sonoff and a Bambu Lab printer.</desc>
  <style>
    .bg { fill: #fbfbf9; }
    .gridline { stroke: #ecebe5; stroke-width: 1; }

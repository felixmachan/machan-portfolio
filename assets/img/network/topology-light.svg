    .zone-title { font: 500 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #5d6167; }
    .node { fill: #ffffff; stroke: #383b40; stroke-width: 1.3; }
    .node--accent { stroke: #b05c1e; }
    .group { fill: #ffffff; stroke: #d9d8d0; stroke-width: 1.2; }
    .tb { fill: #ffffff; stroke: #383b40; stroke-width: 1.2; }
    .rule { stroke: #d9d8d0; stroke-width: 1; }
    .kicker { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #b05c1e; }
    .name { font: 650 16px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1b1d21; }
    .sub { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #5d6167; }
    .svc { font: 600 14px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1b1d21; }
    .desc { font: 400 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .03em; fill: #5d6167; }
    .bullet { fill: none; stroke: #b05c1e; stroke-width: 1.6; }
    .link { fill: none; stroke: #383b40; stroke-width: 1.4; }
    .link--tunnel { stroke: #b05c1e; stroke-dasharray: 7 5; stroke-width: 1.6; }
    .link--radio { stroke-dasharray: 2 4; stroke-linecap: round; stroke-width: 1.8; }
    .dot { fill: #383b40; }
    .link-label { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #5d6167; paint-order: stroke; stroke: #f3f3ef; stroke-width: 5px; }
    .link-label--accent { fill: #b05c1e; }
    .legend { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #5d6167; }
  </style>

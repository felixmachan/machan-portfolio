<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Backup pipeline</title>
  <desc id="d">PostgreSQL is backed up three ways: nightly pg_dump, continuous WAL-G archiving and hourly rclone copies of media and config. Everything is encrypted on the VM and stored in an EU Cloudflare R2 bucket; a point-in-time restore drill completed in about three minutes.</desc>
  <style>
    .bg { fill: #1b1e24; }
    .gridline { stroke: #20232a; stroke-width: 1; }
    .zone { fill: #16181d; stroke: #2f343c; stroke-width: 1.2; }
    .zone-tab { fill: #5b6069; }
    .tab { font: 600 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; fill: #1b1e24; }
    .zone-title { font: 500 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #9aa0a8; }
    .node { fill: #22262d; stroke: #5b6069; stroke-width: 1.3; }
    .node--accent { stroke: #de9552; }
    .kicker { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #de9552; }
    .name { font: 650 16px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8e6e1; }
    .sub { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #9aa0a8; }
    .link { fill: none; stroke: #5b6069; stroke-width: 1.4; }
    .link--tunnel { stroke: #de9552; stroke-dasharray: 7 5; stroke-width: 1.6; }
    .arrow { fill: #5b6069; }
    .arrow--accent { fill: #de9552; }
    .link-label { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #9aa0a8; paint-order: stroke; stroke: #16181d; stroke-width: 5px; }
    .link-label--accent { fill: #de9552; }
    .note { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #9aa0a8; }
  </style>
  <rect class="bg" width="1200" height="420"/>
  <line class="gridline" x1="0" y1="0" x2="0" y2="420"/><line class="gridline" x1="40" y1="0" x2="40" y2="420"/><line class="gridline" x1="80" y1="0" x2="80" y2="420"/><line class="gridline" x1="120" y1="0" x2="120" y2="420"/><line class="gridline" x1="160" y1="0" x2="160" y2="420"/><line class="gridline" x1="200" y1="0" x2="200" y2="420"/><line class="gridline" x1="240" y1="0" x2="240" y2="420"/><line class="gridline" x1="280" y1="0" x2="280" y2="420"/><line class="gridline" x1="320" y1="0" x2="320" y2="420"/><line class="gridline" x1="360" y1="0" x2="360" y2="420"/><line class="gridline" x1="400" y1="0" x2="400" y2="420"/><line class="gridline" x1="440" y1="0" x2="440" y2="420"/><line class="gridline" x1="480" y1="0" x2="480" y2="420"/><line class="gridline" x1="520" y1="0" x2="520" y2="420"/><line class="gridline" x1="560" y1="0" x2="560" y2="420"/><line class="gridline" x1="600" y1="0" x2="600" y2="420"/><line class="gridline" x1="640" y1="0" x2="640" y2="420"/><line class="gridline" x1="680" y1="0" x2="680" y2="420"/><line class="gridline" x1="720" y1="0" x2="720" y2="420"/><line class="gridline" x1="760" y1="0" x2="760" y2="420"/><line class="gridline" x1="800" y1="0" x2="800" y2="420"/><line class="gridline" x1="840" y1="0" x2="840" y2="420"/><line class="gridline" x1="880" y1="0" x2="880" y2="420"/><line class="gridline" x1="920" y1="0" x2="920" y2="420"/><line class="gridline" x1="960" y1="0" x2="960" y2="420"/><line class="gridline" x1="1000" y1="0" x2="1000" y2="420"/><line class="gridline" x1="1040" y1="0" x2="1040" y2="420"/><line class="gridline" x1="1080" y1="0" x2="1080" y2="420"/><line class="gridline" x1="1120" y1="0" x2="1120" y2="420"/><line class="gridline" x1="1160" y1="0" x2="1160" y2="420"/><line class="gridline" x1="1200" y1="0" x2="1200" y2="420"/><line class="gridline" x1="0" y1="0" x2="1200" y2="0"/><line class="gridline" x1="0" y1="40" x2="1200" y2="40"/><line class="gridline" x1="0" y1="80" x2="1200" y2="80"/><line class="gridline" x1="0" y1="120" x2="1200" y2="120"/><line class="gridline" x1="0" y1="160" x2="1200" y2="160"/><line class="gridline" x1="0" y1="200" x2="1200" y2="200"/><line class="gridline" x1="0" y1="240" x2="1200" y2="240"/><line class="gridline" x1="0" y1="280" x2="1200" y2="280"/><line class="gridline" x1="0" y1="320" x2="1200" y2="320"/><line class="gridline" x1="0" y1="360" x2="1200" y2="360"/><line class="gridline" x1="0" y1="400" x2="1200" y2="400"/>
  <rect class="zone" x="24" y="24" width="690" height="372"/>
  <path class="zone-tab" d="M24 24 h44.2 v22 h-44.2 z"/>
  <text class="tab" x="35" y="39">Z-2</text>
  <text class="zone-title" x="80.2" y="39.5">Home · Cheerlify VM</text>
  <rect class="zone" x="738" y="24" width="438" height="372"/>
  <path class="zone-tab" d="M738 24 h44.2 v22 h-44.2 z"/>
  <text class="tab" x="749" y="39">Z-4</text>
  <text class="zone-title" x="794.2" y="39.5">Off-site</text>
  <rect class="node" x="290" y="70" width="220" height="76"/>
  <text class="kicker" x="302" y="89">Nightly</text>
  <text class="name" x="302" y="110">pg_dump</text>
  <text class="sub" x="302" y="128">14 kept · &lt;10 KB rejected</text>
  <rect class="node" x="290" y="170" width="220" height="76"/>
  <text class="kicker" x="302" y="189">Continuous</text>
  <text class="name" x="302" y="210">WAL-G</text>
  <text class="sub" x="302" y="228">WAL ≤ 5 min · weekly base</text>
  <rect class="node" x="290" y="270" width="220" height="76"/>
  <text class="kicker" x="302" y="289">Hourly</text>
  <text class="name" x="302" y="310">rclone</text>
  <text class="sub" x="302" y="328">media · VM config</text>
  <rect class="node" x="44" y="160" width="200" height="96"/>
  <text class="kicker" x="56" y="179">Source</text>
  <text class="name" x="56" y="200">PostgreSQL</text>
  <text class="sub" x="56" y="218">PostGIS 16</text>
  <text class="sub" x="56" y="234">+ media files</text>
  <polyline class="link" points="244,208 266,208 266,108 283,108"/>
  <path class="arrow" d="M290 108 l-9 -4.5 v9 z"/>
  <polyline class="link" points="510,108 532,108 532,208 547,208"/>
  <polyline class="link" points="244,208 266,208 266,208 283,208"/>
  <path class="arrow" d="M290 208 l-9 -4.5 v9 z"/>
  <polyline class="link" points="510,208 532,208 532,208 547,208"/>
  <polyline class="link" points="244,208 266,208 266,308 283,308"/>
  <path class="arrow" d="M290 308 l-9 -4.5 v9 z"/>
  <polyline class="link" points="510,308 532,308 532,208 547,208"/>
  <path class="arrow" d="M554 208 l-9 -4.5 v9 z"/>
  <rect class="node node--accent" x="554" y="160" width="140" height="96"/>
  <text class="kicker" x="566" y="179">Encrypt</text>
  <text class="name" x="566" y="200">On the VM</text>
  <text class="sub" x="566" y="218">before upload</text>
  <text class="sub" x="566" y="234">keys offline</text>
  <line class="link link--tunnel" x1="694" y1="208" x2="773" y2="208"/>
  <path class="arrow arrow--accent" d="M780 208 l-9 -4.5 v9 z"/>
  <text class="link-label link-label--accent" x="737" y="196" text-anchor="middle">TLS</text>
  <rect class="node node--accent" x="780" y="160" width="180" height="96"/>
  <text class="kicker" x="792" y="179">Storage</text>
  <text class="name" x="792" y="200">Cloudflare R2</text>
  <text class="sub" x="792" y="218">EU jurisdiction</text>
  <text class="sub" x="792" y="234">90-day retention</text>
  <line class="link" x1="960" y1="208" x2="989" y2="208"/>
  <path class="arrow" d="M996 208 l-9 -4.5 v9 z"/>
  <rect class="node" x="996" y="160" width="160" height="96"/>
  <text class="kicker" x="1008" y="179">Drill</text>
  <text class="name" x="1008" y="200">PITR restore</text>
  <text class="sub" x="1008" y="218">~3 min download</text>
  <text class="sub" x="1008" y="234">row counts match</text>
  <text class="note" x="780" y="300">Decryption keys live only in a</text>
  <text class="note" x="780" y="318">password manager, never next to</text>
  <text class="note" x="780" y="336">the backups.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="t d">
  <title id="t">Sensor block diagram</title>
  <desc id="d">Two cells feed a reverse-polarity MOSFET and a synchronous boost converter that creates the 3.3 V rail. The rail powers the ESP32-H2 Zigbee module and, through a GPIO-controlled load switch, the time-of-flight sensor header. A switchable divider lets the MCU measure battery voltage; interfaces include a TTL header, EN and BOOT buttons, a Zigbee reset button and a status LED.</desc>
  <style>
    .bg { fill: #1b1e24; }
    .gridline { stroke: #20232a; stroke-width: 1; }
    .zone { fill: #16181d; stroke: #2f343c; stroke-width: 1.2; }
    .zone-tab { fill: #5b6069; }
    .tab { font: 600 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; fill: #1b1e24; }
    .zone-title { font: 500 10.5px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #9aa0a8; }
    .node { fill: #22262d; stroke: #5b6069; stroke-width: 1.3; }
    .node--accent { stroke: #de9552; }
    .kicker { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; fill: #de9552; }
    .name { font: 650 16px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8e6e1; }
    .sub { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #9aa0a8; }
    .link { fill: none; stroke: #5b6069; stroke-width: 1.4; }
    .link--tunnel { stroke: #de9552; stroke-dasharray: 7 5; stroke-width: 1.6; }
    .arrow { fill: #5b6069; }
    .arrow--accent { fill: #de9552; }
    .link-label { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #9aa0a8; paint-order: stroke; stroke: #16181d; stroke-width: 5px; }
    .link-label--accent { fill: #de9552; }
    .note { font: 400 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: #9aa0a8; }

    .link--ctrl { stroke: #de9552; stroke-dasharray: 4 4; stroke-width: 1.4; fill: none; }
    .dot { fill: #5b6069; }
    .board { fill: #22262d; stroke: #5b6069; stroke-width: 1.6; }
    .keepout { fill: url(#hatch); stroke: #2f343c; stroke-width: 1; }
    .hatchline { stroke: #2f343c; stroke-width: 1.2; }
    .region { fill: #2c241d; stroke: #de9552; stroke-width: 1.2; }
    .region--muted { fill: #16181d; stroke: #5b6069; stroke-width: 1; }
    .hole { fill: #1b1e24; stroke: #5b6069; stroke-width: 1.2; }
    .marker { fill: #de9552; }
    .marker-t { font: 600 11px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #1b1e24; }
    .legend-name { font: 600 14px 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8e6e1; }
    .dim { stroke: #9aa0a8; stroke-width: 1; }
    .legend { font: 500 10px 'IBM Plex Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; fill: #9aa0a8; }
  </style>

  <text class="marker-t" x="610" y="206" text-anchor="middle">3</text>
  <text class="legend-name" x="634" y="207">ToF header</text>
  <text class="sub" x="634" y="225">I2C · INT · shutdown · power</text>
  <circle class="marker" cx="610" cy="264" r="10"/>
  <text class="marker-t" x="610" y="268" text-anchor="middle">4</text>

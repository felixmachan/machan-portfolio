  <circle class="marker" cx="610" cy="512" r="10"/>
  <text class="marker-t" x="610" y="516" text-anchor="middle">8</text>
  <text class="legend-name" x="634" y="517">EN button</text>
  <text class="sub" x="634" y="535">hardware reset</text>
</svg>

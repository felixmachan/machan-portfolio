<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A Cheerlify versenynapi termékfolyamata</title>
  <desc id="desc">A futó privát GPX-eseményt hoz létre, a támogatók linkkel és kóddal követik, a buzdítások eljutnak a futóhoz, majd a verseny után összefoglaló készül.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f4"/><stop offset="1" stop-color="#fff0e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7b2d12" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#ff5a1f"/></marker>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#bg)"/>
  <path d="M265 235H405M585 235H725M905 235H1010" fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1020 335C1020 510 790 548 634 548H348" fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 135)"><rect width="195" height="200" rx="28" fill="#fff" stroke="#ffd0bd" stroke-width="3"/><path d="M98 45c-27 0-49 22-49 49 0 37 49 76 49 76s49-39 49-76c0-27-22-49-49-49Zm0 69a20 20 0 1 1 0-40 20 20 0 0 1 0 40Z" fill="#ff5a1f"/><text x="98" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#2d241f">GPX-esemény</text></g>
    <g transform="translate(405 135)"><rect width="180" height="200" rx="28" fill="#fff" stroke="#ffd0bd" stroke-width="3"/><path d="M47 62h86v69H47z" fill="none" stroke="#ff5a1f" stroke-width="8"/><path d="m58 80 32 25 32-25" fill="none" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="176" text-anchor="middle" font-size="21" font-weight="700" fill="#2d241f">Privát link</text></g>
    <g transform="translate(725 135)"><rect width="180" height="200" rx="28" fill="#fff" stroke="#ffd0bd" stroke-width="3"/><circle cx="90" cy="92" r="44" fill="#fff0e8"/><path d="M65 101c16-28 34-40 53-40M67 121c20-9 39-7 51 6" fill="none" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="72" r="8" fill="#ff5a1f"/><text x="90" y="176" text-anchor="middle" font-size="21" font-weight="700" fill="#2d241f">Élő követés</text></g>
    <g transform="translate(1010 135)"><rect width="120" height="200" rx="28" fill="#fff" stroke="#ffd0bd" stroke-width="3"/><rect x="43" y="51" width="34" height="73" rx="17" fill="#ff5a1f"/><path d="M31 99c0 20 13 34 29 34s29-14 29-34M60 133v20M43 153h34" fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round"/><text x="60" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#2d241f">Buzdítás</text></g>
    <g transform="translate(330 455)"><rect width="300" height="150" rx="28" fill="#fff" stroke="#ffd0bd" stroke-width="3"/><path d="M56 40h88v65H56z" fill="#fff0e8" stroke="#ff5a1f" stroke-width="6"/><path d="m68 89 20-19 17 13 18-25 10 13" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="73" text-anchor="middle" font-size="20" font-weight="700" fill="#2d241f">Összefoglaló</text><text x="220" y="103" text-anchor="middle" font-size="15" fill="#705a50">útvonal · adatok · buzdítások</text></g>
  </g>
  <text x="600" y="70" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#2d241f">Az útvonaltól a közös versenyélményig</text>
  <text x="600" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#705a50">A támogatóknak nem kell alkalmazás vagy fiók</text>
